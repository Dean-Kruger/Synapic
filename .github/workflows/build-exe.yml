name: Build Windows Executable + Installer

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90  # Prevent stuck builds from wasting CI minutes

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Check disk space before install
      run: Get-PSDrive C | Select-Object Used,Free

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install PyTorch CPU-only first to avoid large CUDA downloads
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        # Install remaining dependencies (skip hf_xet - not needed for build)
        pip install -r requirements.txt

    - name: Verify installations
      run: |
        python -c "import torch; print(f'PyTorch {torch.__version__}')"
        python -c "import transformers; print(f'Transformers {transformers.__version__}')"
        python -c "import customtkinter; print('CustomTkinter OK')"

    - name: Check disk space before build
      run: Get-PSDrive C | Select-Object Used,Free

    - name: Build with PyInstaller
      run: |
        # Show PyInstaller version and build with verbose output
        pyinstaller --version
        pyinstaller main.spec --noconfirm 2>&1 | Tee-Object -FilePath build.log
      timeout-minutes: 60

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7

    - name: Check disk space after build
      run: Get-PSDrive C | Select-Object Used,Free

    - name: Zip executable
      run: |
        cd dist
        Compress-Archive -Path Synapic -DestinationPath Synapic-Windows.zip

    - name: Upload Artifact (for workflow runs)
      uses: actions/upload-artifact@v4
      with:
        name: Synapic-Windows
        path: dist/Synapic

    - name: Install NSIS
      run: choco install nsis -y

    - name: Add NSIS to PATH
      run: echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

    - name: Build Installer
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        # Strip 'v' prefix from version tag (v1.2.3 -> 1.2.3)
        $ver = "$env:VERSION" -replace '^v', ''
        makensis "/DVERSION=$ver" installer.nsi
        if ($LASTEXITCODE -ne 0) { Write-Error "makensis failed"; exit $LASTEXITCODE }
        Move-Item -Force Synapic-Setup.exe dist\

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Synapic-Installer
        path: dist/Synapic-Setup.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "$env:GITHUB_REF_NAME"
        $ver = $tag -replace '^v', ''

        # Delete existing release for this tag if any (handles re-pushed tags)
        gh release delete "$tag" --yes --discard-tag 2>$null

        # Generate release notes from commits since last tag
        $prevTag = git describe --tags --abbrev=0 "$tag^" 2>$null
        if ($prevTag) {
          $notes = git log "$prevTag..$tag" --oneline --no-merges
        } else {
          $notes = "See the commit history for details."
        }

        gh release create "$tag" `
          "dist/Synapic-Windows.zip" `
          "dist/Synapic-Setup.exe" `
          --title "Synapic $ver" `
          --notes $notes `
          --target "$env:GITHUB_SHA"