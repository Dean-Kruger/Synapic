name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install mypy ruff==0.3.0 pytest pytest-cov
      - name: Lint with Ruff
        run: |
          ruff --version
          ruff check src tests
      - name: Type check with Mypy
        continue-on-error: true
        run: |
          mypy --version
          mypy src
      - name: Run tests
        run: |
          PYTHONPATH=$PWD pytest -q --verbose --ignore=tests/test_ui_dedup.py --ignore=tests/ui/test_provider_tab_local.py --ignore=tests/unit/test_step4_export.py --ignore=tests/test_vector_embedder.py
