name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -q --ignore=tests/unit/test_step4_export.py

      - name: Build application with PyInstaller
        run: pyinstaller main.spec --noconfirm

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: cmd
        run: |
          for /f "tokens=2 delims==" %%i in ('findstr /b "version" pyproject.toml') do set VERSION=%%i
          set VERSION=%VERSION:"=%
          echo Building Synapic v%VERSION%
          "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=%VERSION% installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synapic-Setup-${{ github.ref_name }}
          path: Synapic-Setup.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "Automated build of Synapic $tag."
          if (Test-Path RELEASE_NOTES.md) {
            $notes = Get-Content RELEASE_NOTES.md -Raw
          }
          gh release create $tag "Synapic-Setup.exe#Synapic-Setup.exe" --title "Synapic $tag" --notes $notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
