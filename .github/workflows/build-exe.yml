name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history for release notes

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install PyTorch CPU-only first to avoid large CUDA downloads
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        # Install remaining dependencies
        pip install -r requirements.txt
        pip install pytest

    - name: Run unit tests
      run: |
        $env:PYTHONPATH = "."
        pytest tests/unit -q --ignore=tests/unit/test_step4_export.py

    - name: Build with PyInstaller
      run: |
        pyinstaller --version
        pyinstaller main.spec --noconfirm 2>&1 | Tee-Object -FilePath build.log
      timeout-minutes: 60

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7

    - name: Zip executable
      run: |
        cd dist
        Compress-Archive -Path Synapic -DestinationPath Synapic-Windows.zip

    - name: Install NSIS
      run: choco install nsis -y --no-progress

    - name: Build Installer
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        if ("$env:VERSION" -match "^v?\d+") {
           $ver = "$env:VERSION" -replace '^v', ''
        } else {
           # Fallback for workflow_dispatch on a branch
           $ver = (Select-String -Path pyproject.toml -Pattern 'version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
        }
        echo "Building Synapic v$ver"
        & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$ver" installer.nsi
        if ($LASTEXITCODE -ne 0) { Write-Error "makensis failed"; exit $LASTEXITCODE }
        Move-Item -Force Synapic-Setup.exe dist\

    - name: Create or Update Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "$env:GITHUB_REF_NAME"
        $ver = $tag -replace '^v', ''

        # Try to delete existing release to ensure a clean state (but keep the tag)
        gh release delete "$tag" --yes 2>$null

        # Create release with assets
        gh release create "$tag" `
          "dist/Synapic-Windows.zip" `
          "dist/Synapic-Setup.exe" `
          --title "Synapic $ver" `
          --generate-notes `
          --target "$env:GITHUB_SHA"
