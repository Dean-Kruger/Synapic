name: Build Windows Executable + Installer

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90  # Prevent stuck builds from wasting CI minutes

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Check disk space before install
      run: Get-PSDrive C | Select-Object Used,Free

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install PyTorch CPU-only first to avoid large CUDA downloads
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        # Install remaining dependencies (skip hf_xet - not needed for build)
        pip install -r requirements.txt

    - name: Verify installations
      run: |
        python -c "import torch; print(f'PyTorch {torch.__version__}')"
        python -c "import transformers; print(f'Transformers {transformers.__version__}')"
        python -c "import customtkinter; print('CustomTkinter OK')"

    - name: Check disk space before build
      run: Get-PSDrive C | Select-Object Used,Free

    - name: Build with PyInstaller
      run: |
        # Show PyInstaller version and build with verbose output
        pyinstaller --version
        pyinstaller main.spec --noconfirm 2>&1 | Tee-Object -FilePath build.log
      timeout-minutes: 60

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7

    - name: Check disk space after build
      run: Get-PSDrive C | Select-Object Used,Free

    - name: Zip executable
      run: |
        cd dist
        Compress-Archive -Path Synapic -DestinationPath Synapic-Windows.zip

    - name: Upload Artifact (for workflow runs)
      uses: actions/upload-artifact@v4
      with:
        name: Synapic-Windows
        path: dist/Synapic

    - name: Install NSIS
      run: choco install nsis -y

    - name: Diagnostic — check NSIS and dist
      run: |
        Write-Host "=== Checking makensis ==="
        $paths = @(
          "C:\Program Files (x86)\NSIS\makensis.exe",
          "C:\Program Files\NSIS\makensis.exe",
          "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
          "${env:ProgramFiles}\NSIS\makensis.exe"
        )
        foreach ($p in $paths) {
          if (Test-Path $p) {
            Write-Host "  FOUND: $p"
            & $p /VERSION
          }
        }
        $which = Get-Command makensis -ErrorAction SilentlyContinue
        if ($which) { Write-Host "  On PATH: $($which.Source)" }
        else { Write-Host "  makensis NOT on PATH" }

        Write-Host "=== Contents of dist/ ==="
        if (Test-Path dist) { Get-ChildItem dist\ -Recurse | Select-Object Mode, Length, Name }
        else { Write-Host "  dist/ does not exist!" }

        Write-Host "=== Checking installer.nsi ==="
        if (Test-Path installer.nsi) { Write-Host "  installer.nsi exists" }
        else { Write-Host "  installer.nsi NOT FOUND" }

        if (Test-Path "release\Icon.ico") { Write-Host "  release\Icon.ico exists" }
        else { Write-Host "  release\Icon.ico NOT FOUND" }

    - name: Build Installer
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        # Strip 'v' prefix from version tag (v1.2.3 -> 1.2.3)
        $ver = "$env:VERSION" -replace '^v', ''

        # Find makensis.exe
        $makensis = Get-Command makensis -ErrorAction SilentlyContinue
        if (-not $makensis) {
          foreach ($p in @("C:\Program Files (x86)\NSIS\makensis.exe", "C:\Program Files\NSIS\makensis.exe")) {
            if (Test-Path $p) { $makensis = $p; break }
          }
        }

        if (-not $makensis) { Write-Error "makensis.exe not found!"; exit 1 }

        Write-Host "Using makensis: $makensis"
        & $makensis "/DVERSION=$ver" installer.nsi
        if ($LASTEXITCODE -ne 0) { Write-Error "makensis failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }

        # Move installer to dist for uploading
        Move-Item -Force Synapic-Setup.exe dist\

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Synapic-Installer
        path: dist/Synapic-Setup.exe

    - name: Create Release (for version tags)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/Synapic-Windows.zip
          dist/Synapic-Setup.exe
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}